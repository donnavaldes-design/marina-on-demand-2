<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marina On Demand 2.0</title>
<style>
:root{--ink:#171512;--muted:#746f68;--paper:#f8f4ee;--panel:#fffdf9;--line:#e9dfd4;--accent:#d6503d;--dark:#29221d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}
button,input,textarea{font:inherit}.brand{font-family:Georgia,serif;letter-spacing:-.03em}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 24px 70px rgba(40,28,20,.08)}
h1,h2,p{margin-top:0}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted);font-weight:700}.card h1{font-size:44px;line-height:.95;margin-bottom:14px}.card p{color:var(--muted);line-height:1.6}
.field{display:flex;gap:10px;margin-top:22px}.field input{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff}.primary{border:0;border-radius:12px;padding:14px 18px;background:var(--dark);color:white;font-weight:700;cursor:pointer}.note{font-size:13px;margin-top:14px;color:var(--muted)}
.app{display:none;min-height:100vh;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;background:#f1eae1}.logo{font-size:34px;line-height:.9}.logo small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px;color:var(--muted)}
.new{margin:26px 0 16px;width:100%;padding:12px;border:1px solid #d9cbbd;background:#fff9f3;border-radius:12px;text-align:left;cursor:pointer}.benchmarkBtn{width:100%;padding:10px 12px;margin:0 0 16px;border:1px dashed #c9b29e;background:transparent;border-radius:10px;text-align:left;cursor:pointer;font-size:12px;color:#67584d}.benchmarkBtn:hover{background:#fff8f1}.benchmarkBtn:disabled{opacity:.55;cursor:not-allowed}.benchmarkPanel{max-width:860px;margin:0 auto;padding:20px;border:1px solid var(--line);background:#fff;border-radius:16px}.benchmarkPanel h3{margin:0 0 8px;font-family:Georgia,serif;font-size:1.25rem}.benchmarkProgress{font-size:13px;color:var(--muted);margin-top:6px}.benchmarkBar{height:8px;background:#eee3d8;border-radius:999px;overflow:hidden;margin-top:12px}.benchmarkBar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}.benchmarkLog{margin-top:12px;max-height:260px;overflow:auto;font-size:12px;line-height:1.55;color:#5b5149;background:#fbf8f4;border-radius:10px;padding:10px}.threads{display:flex;flex-direction:column;gap:6px;overflow:auto}.thread{border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer;color:#494039}.thread:hover,.thread.active{background:#fff}.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding-top:18px}
.main{display:flex;flex-direction:column;min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,253,249,.9)}.top span{font-size:12px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:34px max(22px,calc((100vw - 1180px)/2));}.welcome{max-width:780px;margin:7vh auto 0}.welcome h2{font-size:46px;margin-bottom:12px}.welcome p{font-size:18px;color:var(--muted);line-height:1.65}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.quick button{padding:15px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer}
.msg{max-width:840px;margin:0 auto 22px;display:grid;grid-template-columns:40px 1fr;gap:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-size:11px;font-weight:800}.msg.user .avatar{background:#c8b5a3;color:var(--dark)}.bubble{line-height:1.65;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}.msg.user .bubble{background:#f0e7dd;white-space:pre-wrap}.msg.assistant .bubble{white-space:normal}
.composerWrap{border-top:1px solid var(--line);padding:18px 24px;background:var(--panel)}.composer{max-width:860px;margin:auto;display:flex;gap:10px;border:1px solid var(--line);border-radius:18px;padding:10px;background:#fff}.composer textarea{flex:1;border:0;outline:0;resize:none;min-height:54px;padding:7px}.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;cursor:pointer}.attach{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--dark);font-size:21px;cursor:pointer;display:grid;place-items:center}.status{max-width:860px;margin:8px auto 0;font-size:12px;color:var(--muted)}.pending{max-width:860px;margin:0 auto 9px;display:flex;gap:8px;flex-wrap:wrap}.filechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 9px;font-size:12px}.filechip img{width:44px;height:44px;border-radius:8px;object-fit:cover}.filechip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px}.attachmentList{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.attachmentCard{border:1px solid var(--line);background:#faf7f2;border-radius:11px;padding:8px;font-size:12px;max-width:220px}.attachmentCard img{display:block;width:180px;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:7px}
.markdown{line-height:1.5;font-size:1rem;white-space:normal}
.markdown>*:first-child{margin-top:0!important}
.markdown>*:last-child{margin-bottom:0!important}
.markdown p{margin:.38em 0;white-space:normal}
.markdown h1,.markdown h2,.markdown h3,.markdown h4{
  font-family:Georgia,serif;
  line-height:1.16;
  margin:.9em 0 .32em
}
.markdown h1{font-size:1.55rem}
.markdown h2{font-size:1.3rem}
.markdown h3{font-size:1.12rem}
.markdown h4{font-size:1.02rem}
.markdown ul,.markdown ol{
  margin:.42em 0 .55em;
  padding-left:1.35rem
}
.markdown li{white-space:normal;
  margin:.12em 0;
  padding-left:.08rem
}
.markdown li>p{
  margin:.12em 0
}
.markdown li+li{
  margin-top:.14em
}
.markdown strong{font-weight:750;color:#201b17}
.markdown em{font-style:italic}
.markdown blockquote{
  margin:.7em 0;
  padding:.55em .85em;
  border-left:3px solid var(--accent);
  background:#fbf6f1;
  border-radius:0 9px 9px 0;
  color:#4b433d
}
.markdown blockquote p{margin:.2em 0}
.markdown hr{
  border:0;
  border-top:1px solid var(--line);
  margin:.85em 0
}
.markdown table{
  width:100%;
  border-collapse:collapse;
  margin:.7em 0;
  font-size:.94rem
}
.markdown th,.markdown td{
  border:1px solid var(--line);
  padding:6px 8px;
  text-align:left;
  vertical-align:top
}
.markdown th{background:#f6efe7}
.markdown code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#f4eee7;
  padding:.1em .3em;
  border-radius:5px;
  font-size:.92em
}
.markdown pre{
  overflow:auto;
  background:#2a241f;
  color:#fff;
  padding:12px;
  border-radius:10px;
  margin:.65em 0
}
.markdown pre code{background:transparent;color:inherit;padding:0}
.markdown a{color:#8f3150;text-decoration:underline;text-underline-offset:2px}


.homeBtn{width:100%;padding:11px 12px;margin:24px 0 8px;border:0;background:var(--dark);color:#fff;border-radius:12px;text-align:left;cursor:pointer;font-weight:750}
.new{margin:0 0 8px}
.memoryBtn{margin:0 0 16px}
.dashboard{max-width:960px;margin:1vh auto 0}
.dashboardHero{padding:10px 0 20px}
.dashboardHero .eyebrow{margin-bottom:8px}
.dashboardHero h2{font-family:Georgia,serif;font-size:42px;line-height:1.02;margin:0 0 10px;letter-spacing:-.035em}
.dashboardHero p{color:var(--muted);font-size:16px;line-height:1.55;max-width:760px}
.focusCard{background:var(--dark);color:#fff;border-radius:20px;padding:22px;margin:4px 0 18px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.focusCard small{display:block;text-transform:uppercase;letter-spacing:.12em;opacity:.65;font-size:10px;margin-bottom:7px}
.focusCard strong{font-family:Georgia,serif;font-size:24px;line-height:1.15;font-weight:600}
.focusCard button{border:0;background:#fff;color:var(--dark);font-weight:800;border-radius:12px;padding:12px 16px;cursor:pointer;white-space:nowrap}
.businessGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.bizCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:92px}
.bizCard small{display:block;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:9px;font-weight:800;margin-bottom:7px}
.bizCard strong{display:block;font-size:14px;line-height:1.35;font-weight:720}
.modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.modeCard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.modeCard:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(40,28,20,.07)}
.modeCard .modeIcon{font-size:22px;margin-bottom:12px}.modeCard strong{display:block;font-family:Georgia,serif;font-size:20px;margin-bottom:6px}.modeCard span{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.betaPill{display:inline-block!important;width:auto!important;margin-left:5px;padding:2px 6px;border-radius:999px;background:#f3e4dd;color:#8f3f30!important;font-family:Inter,sans-serif;font-size:8px!important;text-transform:uppercase;letter-spacing:.08em;vertical-align:middle}
.modeBar{max-width:860px;margin:0 auto 10px;display:flex;gap:6px;align-items:center}.modeChip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;color:var(--muted);cursor:pointer}.modeChip.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.hub{max-width:840px;margin:5vh auto 0}.hub h2{font-family:Georgia,serif;font-size:40px;margin-bottom:8px}.hub p{color:var(--muted);font-size:16px;line-height:1.55}.hubGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.hubBtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:left;cursor:pointer}.hubBtn strong{display:block;margin-bottom:4px}.hubBtn span{font-size:12px;color:var(--muted);line-height:1.4}.actionCallout{border:1px solid #e4c6bb;background:#fff8f4;border-radius:16px;padding:16px;margin:18px 0}.actionCallout strong{font-family:Georgia,serif;font-size:18px}.actionCallout p{font-size:13px;margin:6px 0 0}.receipt{display:flex;gap:7px;align-items:center;margin-top:10px;font-size:10px;color:#81776f;text-transform:uppercase;letter-spacing:.07em}.receipt span{background:#f5efe9;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.feedback{display:flex;gap:5px;margin-top:9px}.feedback button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;cursor:pointer;color:#746f68;font-size:12px}.feedback button.selected{background:#f3ebe3;color:var(--dark)}
.memoryBtn{width:100%;padding:10px 12px;margin:-8px 0 16px;border:1px solid #dacdc1;background:#fffaf5;border-radius:10px;text-align:left;cursor:pointer;font-size:12px;color:#67584d}
.memoryBtn:hover{background:#fff}
.memoryPanel{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.memoryPanel h2{font-family:Georgia,serif;font-size:1.65rem;margin:0 0 6px}
.memoryIntro{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:18px}
.memoryGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.memoryField{display:flex;flex-direction:column;gap:5px}
.memoryField.full{grid-column:1/-1}
.memoryField label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.memoryField input,.memoryField textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;font:inherit;color:var(--ink)}
.memoryField textarea{min-height:88px;resize:vertical}
.memoryActions{display:flex;gap:9px;align-items:center;margin-top:16px}
.secondaryBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
.dangerBtn{border:1px solid #e5c1bc;background:#fff8f6;color:#a83e33;border-radius:10px;padding:10px 14px;cursor:pointer;margin-left:auto}
.memoryStatus{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:760px){.businessGrid,.modeGrid{grid-template-columns:1fr}.focusCard{grid-template-columns:1fr}.hubGrid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:24px 14px}.welcome h2{font-size:38px}.quick{grid-template-columns:1fr}.top{padding:0 16px}}
</style>
</head>
<body>
<div id="login" class="center">
  <div class="card">
    <div class="eyebrow">Private Beta</div>
    <h1 class="brand">Marina<br>On Demand</h1>
    <p>Brand. Lead. Convert. Sign in with your email and Marina will send you a secure magic link.</p>
    <form id="loginForm" class="field">
      <input id="email" type="email" placeholder="you@example.com" required>
      <button class="primary" type="submit">Send link</button>
    </form>
    <div id="loginStatus" class="note"></div>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="logo brand">Marina<br>On Demand<small>Brand. Lead. Convert.</small></div>
    <button id="homeBtn" class="homeBtn" type="button">⌂ Business Dashboard</button>
    <button id="newChat" class="new">+ New conversation</button>
    <button id="memoryBtn" class="memoryBtn" type="button">What Marina remembers</button>
    <div id="threads" class="threads"></div>
    <div class="sidefoot"><span id="userEmail"></span><br><button id="signOut" style="border:0;background:transparent;padding:8px 0;color:inherit;cursor:pointer">Sign out</button></div>
  </aside>
  <section class="main">
    <header class="top"><strong>Marina On Demand</strong><span id="modelLabel">Private Beta</span></header>
    <div id="messages" class="messages"></div>
    <div class="composerWrap">
      <div id="pending" class="pending"></div>
      <form id="composer" class="composer">
        <input id="fileInput" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/markdown,application/json,text/csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
        <button id="attachBtn" class="attach" type="button" title="Attach screenshot, image, PDF or document">＋</button>
        <textarea id="input" placeholder="Ask Marina..."></textarea>
        <button class="send" type="submit">↑</button>
      </form>
      <div id="status" class="status"></div>
    </div>
  </section>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { marked } from "https://esm.sh/marked@15";
import DOMPurify from "https://esm.sh/dompurify@3";

const qs = s => document.querySelector(s);
const state = { supabase:null, session:null, conversationId:"", messages:[], conversations:[], loading:false, pendingFiles:[], mode:"coach", dashboard:null };

const config = await fetch("/api/config").then(r=>r.json());
qs("#modelLabel").textContent = `Private Beta · ${config.build || "build"}`;
state.supabase = createClient(config.supabaseUrl, config.supabasePublishableKey, {
  auth:{persistSession:true,detectSessionInUrl:true,flowType:"pkce"}
});

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderMarkdown(s){
  const raw = marked.parse(String(s||""), {gfm:true, breaks:false});
  return DOMPurify.sanitize(raw, {
    USE_PROFILES:{html:true},
    ADD_ATTR:["target","rel"]
  });
}
function authHeader(){return {Authorization:`Bearer ${state.session.access_token}`,"content-type":"application/json"}}

async function refreshSession(){
  const {data} = await state.supabase.auth.getSession();
  state.session = data.session;
  if(state.session){
    qs("#login").style.display="none"; qs("#app").style.display="grid";
    qs("#userEmail").textContent=state.session.user.email || "";
    await loadConversations(); await renderDashboard();
  }else{
    qs("#login").style.display="grid"; qs("#app").style.display="none";
  }
}
state.supabase.auth.onAuthStateChange((_e,s)=>{state.session=s; refreshSession()});
await refreshSession();

qs("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=qs("#email").value.trim();
  qs("#loginStatus").textContent="Sending secure link...";
  const {error}=await state.supabase.auth.signInWithOtp({
    email,
    options:{ emailRedirectTo: window.location.origin }
  });
  qs("#loginStatus").textContent=error ? error.message : "Check your email. Click the Marina On Demand sign-in link.";
});

qs("#signOut").addEventListener("click",async()=>{await state.supabase.auth.signOut();location.href="/"});
qs("#homeBtn").addEventListener("click",async()=>{if(state.loading)return;await renderDashboard()});
qs("#newChat").addEventListener("click",()=>{state.conversationId="";state.messages=[];state.pendingFiles=[];state.mode="coach";renderPending();renderWelcome();renderThreads()});
qs("#memoryBtn").addEventListener("click", async ()=>{
  if(state.loading)return;
  await openMemoryPanel();
});
qs("#composer").addEventListener("submit",e=>{e.preventDefault();send()});
qs("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
qs("#attachBtn").addEventListener("click",()=>qs("#fileInput").click());
qs("#fileInput").addEventListener("change",e=>{
  const files=[...(e.target.files||[])];
  for(const file of files){
    if(state.pendingFiles.length>=5){qs("#status").textContent="Up to 5 attachments per message.";break}
    if(file.size>20*1024*1024){qs("#status").textContent=`${file.name} is over 20 MB.`;continue}
    state.pendingFiles.push(file);
  }
  e.target.value="";
  renderPending();
});




const MEMORY_UI_FIELDS = [
  ["business_type","Business type"],
  ["company_or_vehicle","Company / vehicle"],
  ["primary_offer","Primary offer"],
  ["target_audience","Target audience"],
  ["primary_goal","Primary goal"],
  ["current_constraint","Current constraint"],
  ["current_framework","Current framework"],
  ["preferred_platform","Preferred platform"],
  ["last_assignment","Last assignment"],
  ["last_assignment_status","Assignment status"],
  ["brand_positioning","Brand positioning"],
];

async function openMemoryPanel(){
  state.messages=[];
  state.conversationId="";
  qs("#status").textContent="";
  qs("#messages").innerHTML=`
    <div class="memoryPanel">
      <h2>What Marina remembers</h2>
      <div class="memoryIntro">
        Marina keeps only useful business context so she can continue where you left off.
        Review it anytime. Sensitive personal information is not intentionally stored here.
      </div>
      <div id="memoryForm" class="memoryGrid"></div>
      <div class="memoryActions">
        <button id="saveMemory" class="primary" type="button">Save changes</button>
        <button id="reloadMemory" class="secondaryBtn" type="button">Reload</button>
        <button id="clearMemory" class="dangerBtn" type="button">Clear memory</button>
      </div>
      <div id="memoryStatus" class="memoryStatus">Loading…</div>
    </div>`;
  await loadMemoryIntoForm();
  qs("#saveMemory").onclick=saveMemoryForm;
  qs("#reloadMemory").onclick=loadMemoryIntoForm;
  qs("#clearMemory").onclick=clearMemory;
}

async function loadMemoryIntoForm(){
  const status=qs("#memoryStatus");
  status.textContent="Loading…";
  try{
    const j=await api("/api/memory");
    const memory=j.memory||{};
    const form=qs("#memoryForm");
    form.innerHTML=MEMORY_UI_FIELDS.map(([key,label])=>`
      <div class="memoryField ${key==="brand_positioning"?"full":""}">
        <label for="mem_${key}">${esc(label)}</label>
        ${key==="brand_positioning"
          ? `<textarea id="mem_${key}">${esc(memory[key]||"")}</textarea>`
          : `<input id="mem_${key}" value="${esc(memory[key]||"")}">`}
      </div>`).join("") + `
      <div class="memoryField full">
        <label for="mem_important_business_context">Other useful business context, one item per line</label>
        <textarea id="mem_important_business_context">${esc((memory.important_business_context||[]).join("\n"))}</textarea>
      </div>`;
    status.textContent=Object.keys(memory).length
      ? "This is the business context Marina can carry into future chats."
      : "No durable business memory yet. Marina will build this gradually from what you explicitly share.";
  }catch(e){
    status.textContent=e.message;
  }
}

async function saveMemoryForm(){
  const status=qs("#memoryStatus");
  status.textContent="Saving…";
  const patch={};
  for(const [key] of MEMORY_UI_FIELDS){
    patch[key]=qs(`#mem_${key}`).value;
  }
  patch.important_business_context=qs("#mem_important_business_context").value
    .split("\n").map(x=>x.trim()).filter(Boolean);
  try{
    await api("/api/memory",{method:"PATCH",body:JSON.stringify(patch)});
    status.textContent="Saved. Marina will use this context when it is relevant.";
  }catch(e){
    status.textContent=e.message;
  }
}

async function clearMemory(){
  const status=qs("#memoryStatus");
  if(!confirm("Clear Marina's saved business memory for this account? Your conversation history will remain."))return;
  status.textContent="Clearing…";
  try{
    await api("/api/memory",{method:"DELETE"});
    await loadMemoryIntoForm();
    status.textContent="Business memory cleared. Conversation history was not deleted.";
  }catch(e){
    status.textContent=e.message;
  }
}

function renderBenchmarkPanel(runId, completed, total, currentLabel, lines){
  const pct = total ? Math.round((completed/total)*100) : 0;
  qs("#messages").innerHTML = `
    <div class="benchmarkPanel">
      <h3>Marina 2.0 Migration Benchmark</h3>
      <div class="benchmarkProgress">${esc(currentLabel)}</div>
      <div class="benchmarkBar"><span style="width:${pct}%"></span></div>
      <div class="benchmarkLog">
        <strong>Run ID:</strong> ${esc(runId)}<br>
        ${lines.map(x=>esc(x)).join("<br>")}
      </div>
    </div>`;
}

async function runBenchmark(){
  state.loading=true;
  qs("#benchmarkBtn").disabled=true;
  qs("#composer").style.opacity=".45";
  qs("#composer").style.pointerEvents="none";

  const runId = crypto.randomUUID();
  const lines = [];
  let tests = [];

  try{
    const setup = await api("/api/benchmark");
    tests = setup.tests || [];
    renderBenchmarkPanel(runId,0,tests.length,`Starting ${tests.length} fresh-chat tests...`,lines);

    for(let i=0;i<tests.length;i++){
      const test=tests[i];
      renderBenchmarkPanel(
        runId,
        i,
        tests.length,
        `Running ${test.id}/${tests.length} · ${test.category}`,
        lines
      );

      try{
        await api("/api/benchmark",{
          method:"POST",
          body:JSON.stringify({runId,testId:test.id})
        });
        lines.push(`✓ ${test.id} · ${test.category}`);
      }catch(e){
        lines.push(`✗ ${test.id} · ${test.category} · ${e.message}`);
      }

      renderBenchmarkPanel(
        runId,
        i+1,
        tests.length,
        `Completed ${i+1}/${tests.length}`,
        lines
      );
    }

    renderBenchmarkPanel(
      runId,
      tests.length,
      tests.length,
      `Complete. ${tests.length}/${tests.length} tests attempted. Tell ChatGPT: "benchmark complete".`,
      lines
    );
  }catch(e){
    lines.push(`Benchmark setup failed: ${e.message}`);
    renderBenchmarkPanel(runId,0,tests.length||30,"Benchmark stopped.",lines);
  }finally{
    state.loading=false;
    qs("#benchmarkBtn").disabled=false;
    qs("#composer").style.opacity="1";
    qs("#composer").style.pointerEvents="auto";
  }
}

function readableSize(n){
  if(!n)return"0 B";
  if(n<1024)return`${n} B`;
  if(n<1024*1024)return`${(n/1024).toFixed(1)} KB`;
  return`${(n/1024/1024).toFixed(1)} MB`;
}
function renderPending(){
  qs("#pending").innerHTML=state.pendingFiles.map((f,i)=>{
    const image=f.type.startsWith("image/") ? `<img src="${URL.createObjectURL(f)}" alt="">` : "";
    return `<div class="filechip">${image}<span>${esc(f.name)}<br><small>${readableSize(f.size)}</small></span><button type="button" data-remove="${i}">×</button></div>`;
  }).join("");
  qs("#pending").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
    state.pendingFiles.splice(Number(b.dataset.remove),1);renderPending();
  });
}
function cleanFileName(name){
  return String(name||"attachment")
    .replace(/[^a-zA-Z0-9._-]+/g,"-")
    .replace(/-+/g,"-")
    .slice(-120);
}
async function uploadPendingFiles(){
  const uploaded=[];
  for(const file of state.pendingFiles){
    const path=`${state.session.user.id}/${Date.now()}-${crypto.randomUUID()}-${cleanFileName(file.name)}`;
    qs("#status").textContent=`Uploading ${file.name}...`;
    const {error}=await state.supabase.storage
      .from("marina-attachments")
      .upload(path,file,{contentType:file.type||undefined,upsert:false});
    if(error)throw new Error(`Upload failed: ${error.message}`);
    uploaded.push({
      storagePath:path,
      fileName:file.name,
      mimeType:file.type||"application/octet-stream",
      sizeBytes:file.size
    });
  }
  return uploaded;
}

async function api(url, options={}){
  const r=await fetch(url,{...options,headers:{...authHeader(),...(options.headers||{})}});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error || "Request failed");
  return j;
}


function modeLabel(mode){return mode==="action"?"Action Mode ⚡":mode==="create"?"Create With Me":"Coach Me"}
function routeLabel(route){
  return ({framework:"Marina Method Library",identity:"Identity Mode",product:"Product Fit Logic",current:"Current Data Guardrail",operator:"Operator Mode"})[route]||"Marina Strategy";
}
function setMode(mode){
  state.mode=["coach","create","action"].includes(mode)?mode:"coach";
  const input=qs("#input");
  input.placeholder=state.mode==="action"?"What do you want Marina to help execute?":state.mode==="create"?"What should Marina build with you?":"Ask Marina...";
}
function resetWorkspace(mode="coach"){
  state.conversationId="";state.messages=[];state.pendingFiles=[];setMode(mode);renderPending();renderThreads();
}
async function renderDashboard(){
  resetWorkspace("coach");
  qs("#messages").innerHTML=`<div class="dashboard"><div class="dashboardHero"><div class="eyebrow">Your Business, Remembered</div><h2>Marina knows where you left off.</h2><p>One business brain. One current focus. Pick how you want Marina to work with you today.</p></div><div class="bizCard">Loading your business...</div></div>`;
  try{
    const j=await api("/api/dashboard");state.dashboard=j;
    const m=j.memory||{};
    const cards=[
      ["Primary offer",m.primary_offer],["Audience",m.target_audience],["Goal",m.primary_goal],
      ["Current bottleneck",m.current_constraint],["Platform",m.preferred_platform],["Last assignment",m.last_assignment]
    ];
    qs("#messages").innerHTML=`<div class="dashboard">
      <div class="dashboardHero"><div class="eyebrow">Your Business, Remembered</div><h2>Marina knows where you left off.</h2><p>No starting over. No re-explaining your business every time. Here is the work in front of us.</p></div>
      <div class="focusCard"><div><small>Today's Move</small><strong>${esc(j.todayMove||"Ask Marina for today's move.")}</strong></div><button id="todayMoveBtn">Work this with Marina →</button></div>
      <div class="businessGrid">${cards.map(([label,value])=>`<div class="bizCard"><small>${esc(label)}</small><strong>${esc(value||"Not set yet")}</strong></div>`).join("")}</div>
      <div class="eyebrow">How do you want Marina to work today?</div>
      <div class="modeGrid">
        <button class="modeCard" data-mode="coach"><div class="modeIcon">💬</div><strong>Coach Me</strong><span>Diagnose the real issue, challenge the thinking, and give me the next move.</span></button>
        <button class="modeCard" data-mode="create"><div class="modeIcon">✍️</div><strong>Create With Me</strong><span>Build the actual post, Reel, DM flow, offer, funnel, live, or campaign.</span></button>
        <button class="modeCard" data-mode="action"><div class="modeIcon">⚡</div><strong>Action Mode <span class="betaPill">Beta</span></strong><span>Turn a goal into a sequenced execution plan and build everything Marina can complete here.</span></button>
      </div>
    </div>`;
    qs("#todayMoveBtn").onclick=()=>{resetWorkspace("coach");send("Based on what you remember about my business, help me execute today's highest-leverage move. Keep me focused and give me the exact first steps.","coach")};
    qs("#messages").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>openMode(b.dataset.mode));
  }catch(e){qs("#messages").innerHTML=`<div class="welcome"><h2 class="brand">Marina is ready.</h2><p>${esc(e.message)}</p></div>`}
}
function openMode(mode){
  resetWorkspace(mode);
  if(mode==="create")return renderCreateHub();
  if(mode==="action")return renderActionHub();
  renderWelcome();
}
function renderModeBar(){
  return `<div class="modeBar">${["coach","create","action"].map(m=>`<button class="modeChip ${state.mode===m?"active":""}" data-switch-mode="${m}">${modeLabel(m)}</button>`).join("")}</div>`;
}
function wireModeBar(){
  qs("#messages").querySelectorAll("[data-switch-mode]").forEach(b=>b.onclick=()=>openMode(b.dataset.switchMode));
}
function renderCreateHub(){
  qs("#messages").innerHTML=renderModeBar()+`<div class="hub"><div class="eyebrow">Create With Me</div><h2>Don't explain it. Build it.</h2><p>Choose a starting point or tell Marina exactly what you need in the box below.</p><div class="hubGrid">
    ${[
      ["Build my week","Build my 7-day content and conversion plan around my current offer and goal."],
      ["Write today's content","Write today's highest-leverage piece of content for my current goal, including hook, body, CTA and suggested format."],
      ["Create my DM follow-up","Create the warm-audience DM follow-up flow I should use today based on my current offer."],
      ["Audit my offer","Audit my current offer using Offer → Message → Path → Volume → Conversion and rewrite what is weak."],
      ["Build a live","Create a 20-minute weekly live that naturally leads to my current offer."],
      ["Build the funnel","Build the simplest conversion path for my current offer, including page sections, CTA and follow-up."]
    ].map(([title,prompt])=>`<button class="hubBtn" data-create="${esc(prompt)}"><strong>${esc(title)}</strong><span>Marina will use what she already remembers about your business.</span></button>`).join("")}
  </div></div>`;
  wireModeBar();qs("#messages").querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>send(b.dataset.create,"create"));
}
function renderActionHub(){
  qs("#messages").innerHTML=renderModeBar()+`<div class="hub"><div class="eyebrow">Action Mode ⚡ <span class="betaPill">Beta</span></div><h2>Give Marina the outcome.</h2><p>Action Mode turns the goal into an execution sequence, builds the assets Marina can complete here, and separates anything that still needs your approval or an external app connection.</p><div class="actionCallout"><strong>Try this tomorrow:</strong><p>“I need to sell 10 of my $97 workshop this month. Take the lead and build what I need to do this week.”</p></div><div class="hubGrid">
    <button class="hubBtn" data-action="Take my current goal and build the exact 7-day execution sprint I should follow. Create the content, CTAs and follow-up assets you can complete here, then show me anything that needs my approval."><strong>Build my 7-day sprint</strong><span>Strategy + assets + sequence.</span></button>
    <button class="hubBtn" data-action="Look at what you remember about my business and identify the single biggest conversion bottleneck. Take the lead on fixing it and build everything you can here."><strong>Fix my biggest bottleneck</strong><span>Diagnose it and start executing.</span></button>
  </div></div>`;
  wireModeBar();qs("#messages").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>send(b.dataset.action,"action"));
}

async function loadConversations(){
  try{
    const j=await api("/api/conversations");
    state.conversations=j.conversations||[]; renderThreads();
  }catch(e){qs("#status").textContent=e.message}
}
function renderThreads(){
  qs("#threads").innerHTML=state.conversations.map(c=>`<button class="thread ${c.id===state.conversationId?"active":""}" data-id="${c.id}">${esc(c.title||"Conversation")}</button>`).join("");
  qs("#threads").querySelectorAll("button").forEach(b=>b.onclick=()=>selectConversation(b.dataset.id));
}
async function selectConversation(id){
  state.conversationId=id;
  const j=await api(`/api/messages?conversationId=${encodeURIComponent(id)}`);
  state.messages=j.messages||[]; renderMessages(); renderThreads();
}
function renderWelcome(){
  if(state.messages.length){renderMessages();return}
  if(state.mode==="create")return renderCreateHub();
  if(state.mode==="action")return renderActionHub();
  qs("#messages").innerHTML=renderModeBar()+`<div class="welcome">
    <h2 class="brand">What are we fixing today?</h2>
    <p>Bring me the messy caption, the vague offer, the dead DMs, the Reel that got views but no buyers, or the thing you keep overthinking.</p>
    <div class="quick">
      ${[
        "Rewrite my profile like a Lead Slayer",
        "Create my Seven Layers Deep DM flow",
        "Turn my story into a weekly live",
        "Build my warm lead follow-up plan"
      ].map(x=>`<button data-p="${esc(x)}">${esc(x)}</button>`).join("")}
    </div></div>`;
  wireModeBar();qs("#messages").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p,"coach"));
}
function renderMessages(){
  if(!state.messages.length){renderWelcome();return}
  qs("#messages").innerHTML=renderModeBar()+state.messages.map(m=>{
    const atts=(m.attachments||[]).map(a=>{
      const img=(a.mime_type||"").startsWith("image/") && a.signed_url
        ? `<img src="${esc(a.signed_url)}" alt="${esc(a.file_name)}">`
        : "";
      const link=a.signed_url
        ? `<a href="${esc(a.signed_url)}" target="_blank" rel="noopener">${esc(a.file_name)}</a>`
        : esc(a.file_name);
      return `<div class="attachmentCard">${img}${link}<br><small>${readableSize(a.size_bytes||0)}</small></div>`;
    }).join("");
    const body = m.role==="assistant"
      ? `<div class="markdown">${renderMarkdown(m.content)}</div>`
      : `<div>${esc(m.content)}</div>`;
    const receipt=m.role==="assistant"?`<div class="receipt"><span>${esc(modeLabel(m.experience_mode||state.mode))}</span><span>${esc(routeLabel(m.route))}</span></div>`:"";
    const feedback=m.role==="assistant"&&m.id?`<div class="feedback" data-feedback-for="${esc(m.id)}"><button data-rating="1" title="Helpful">👍</button><button data-rating="-1" title="Needs improvement">👎</button></div>`:"";
    return `<div class="msg ${m.role}">
      <div class="avatar">${m.role==="assistant"?"M":"YOU"}</div>
      <div class="bubble">${body}${atts?`<div class="attachmentList">${atts}</div>`:""}${receipt}${feedback}</div>
    </div>`;
  }).join("") + (state.loading?`<div class="msg assistant"><div class="avatar">M</div><div class="bubble">Working...</div></div>`:"");
  wireModeBar();
  qs("#messages").querySelectorAll("[data-feedback-for]").forEach(box=>{
    box.querySelectorAll("button").forEach(btn=>btn.onclick=async()=>{
      try{
        await api("/api/feedback",{method:"POST",body:JSON.stringify({messageId:box.dataset.feedbackFor,rating:Number(btn.dataset.rating)})});
        box.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));btn.classList.add("selected");
        qs("#status").textContent=btn.dataset.rating==="1"?"Saved. Marina learns what works.":"Saved. We'll use this to tune Marina.";
        setTimeout(()=>{qs("#status").textContent=""},1800);
      }catch(e){qs("#status").textContent=e.message}
    })
  });
  qs("#messages").scrollTop=qs("#messages").scrollHeight;
}
async function send(prefill, forcedMode){
  const input=qs("#input");
  if(forcedMode)setMode(forcedMode);
  const value=String(prefill ?? input.value).trim();
  if((!value&&!state.pendingFiles.length)||state.loading)return;

  state.loading=true;
  input.value="";
  qs("#status").textContent="";

  const localAttachments=state.pendingFiles.map(f=>({
    file_name:f.name,
    mime_type:f.type,
    size_bytes:f.size,
    signed_url:f.type.startsWith("image/") ? URL.createObjectURL(f) : null
  }));

  state.messages.push({
    role:"user",
    content:value||"[Attachment]",
    attachments:localAttachments
  });
  renderMessages();

  try{
    const attachments=await uploadPendingFiles();
    state.pendingFiles=[];
    renderPending();
    qs("#status").textContent="Marina is looking at it...";

    const j=await api("/api/chat",{
      method:"POST",
      body:JSON.stringify({
        message:value,
        conversationId:state.conversationId||undefined,
        attachments,
        mode:state.mode
      })
    });

    state.conversationId=j.conversationId;
    state.messages.push({id:j.messageId,role:"assistant",content:j.answer,attachments:[],route:j.route,experience_mode:j.mode||state.mode});
    await loadConversations();
    qs("#status").textContent="";
  }catch(e){
    qs("#status").textContent=e.message;
  }

  state.loading=false;
  renderMessages();
}
</script>
