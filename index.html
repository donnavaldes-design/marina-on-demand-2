<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marina On Demand 2.0</title>
<style>
:root{--ink:#171512;--muted:#746f68;--paper:#f8f4ee;--panel:#fffdf9;--line:#e9dfd4;--accent:#d6503d;--dark:#29221d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}
button,input,textarea{font:inherit}.brand{font-family:Georgia,serif;letter-spacing:-.03em}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 24px 70px rgba(40,28,20,.08)}
h1,h2,p{margin-top:0}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted);font-weight:700}.card h1{font-size:44px;line-height:.95;margin-bottom:14px}.card p{color:var(--muted);line-height:1.6}
.field{display:flex;gap:10px;margin-top:22px}.field input{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff}.primary{border:0;border-radius:12px;padding:14px 18px;background:var(--dark);color:white;font-weight:700;cursor:pointer}.note{font-size:13px;margin-top:14px;color:var(--muted)}
.app{display:none;min-height:100vh;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;background:#f1eae1}.logo{font-size:34px;line-height:.9}.logo small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px;color:var(--muted)}
.new{margin:26px 0 16px;width:100%;padding:12px;border:1px solid #d9cbbd;background:#fff9f3;border-radius:12px;text-align:left;cursor:pointer}.threads{display:flex;flex-direction:column;gap:6px;overflow:auto}.thread{border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer;color:#494039}.thread:hover,.thread.active{background:#fff}.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding-top:18px}
.main{display:flex;flex-direction:column;min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,253,249,.9)}.top span{font-size:12px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:34px max(22px,calc((100vw - 1180px)/2));}.welcome{max-width:780px;margin:7vh auto 0}.welcome h2{font-size:46px;margin-bottom:12px}.welcome p{font-size:18px;color:var(--muted);line-height:1.65}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.quick button{padding:15px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer}
.msg{max-width:840px;margin:0 auto 22px;display:grid;grid-template-columns:40px 1fr;gap:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-size:11px;font-weight:800}.msg.user .avatar{background:#c8b5a3;color:var(--dark)}.bubble{line-height:1.65;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}.msg.user .bubble{background:#f0e7dd;white-space:pre-wrap}.msg.assistant .bubble{white-space:normal}
.composerWrap{border-top:1px solid var(--line);padding:18px 24px;background:var(--panel)}.composer{max-width:860px;margin:auto;display:flex;gap:10px;border:1px solid var(--line);border-radius:18px;padding:10px;background:#fff}.composer textarea{flex:1;border:0;outline:0;resize:none;min-height:54px;padding:7px}.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;cursor:pointer}.attach{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--dark);font-size:21px;cursor:pointer;display:grid;place-items:center}.status{max-width:860px;margin:8px auto 0;font-size:12px;color:var(--muted)}.pending{max-width:860px;margin:0 auto 9px;display:flex;gap:8px;flex-wrap:wrap}.filechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 9px;font-size:12px}.filechip img{width:44px;height:44px;border-radius:8px;object-fit:cover}.filechip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px}.attachmentList{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.attachmentCard{border:1px solid var(--line);background:#faf7f2;border-radius:11px;padding:8px;font-size:12px;max-width:220px}.attachmentCard img{display:block;width:180px;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:7px}
.markdown{line-height:1.5;font-size:1rem;white-space:normal}
.markdown>*:first-child{margin-top:0!important}
.markdown>*:last-child{margin-bottom:0!important}
.markdown p{margin:.38em 0;white-space:normal}
.markdown h1,.markdown h2,.markdown h3,.markdown h4{
  font-family:Georgia,serif;
  line-height:1.16;
  margin:.9em 0 .32em
}
.markdown h1{font-size:1.55rem}
.markdown h2{font-size:1.3rem}
.markdown h3{font-size:1.12rem}
.markdown h4{font-size:1.02rem}
.markdown ul,.markdown ol{
  margin:.42em 0 .55em;
  padding-left:1.35rem
}
.markdown li{white-space:normal;
  margin:.12em 0;
  padding-left:.08rem
}
.markdown li>p{
  margin:.12em 0
}
.markdown li+li{
  margin-top:.14em
}
.markdown strong{font-weight:750;color:#201b17}
.markdown em{font-style:italic}
.markdown blockquote{
  margin:.7em 0;
  padding:.55em .85em;
  border-left:3px solid var(--accent);
  background:#fbf6f1;
  border-radius:0 9px 9px 0;
  color:#4b433d
}
.markdown blockquote p{margin:.2em 0}
.markdown hr{
  border:0;
  border-top:1px solid var(--line);
  margin:.85em 0
}
.markdown table{
  width:100%;
  border-collapse:collapse;
  margin:.7em 0;
  font-size:.94rem
}
.markdown th,.markdown td{
  border:1px solid var(--line);
  padding:6px 8px;
  text-align:left;
  vertical-align:top
}
.markdown th{background:#f6efe7}
.markdown code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#f4eee7;
  padding:.1em .3em;
  border-radius:5px;
  font-size:.92em
}
.markdown pre{
  overflow:auto;
  background:#2a241f;
  color:#fff;
  padding:12px;
  border-radius:10px;
  margin:.65em 0
}
.markdown pre code{background:transparent;color:inherit;padding:0}
.markdown a{color:#8f3150;text-decoration:underline;text-underline-offset:2px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:24px 14px}.welcome h2{font-size:38px}.quick{grid-template-columns:1fr}.top{padding:0 16px}}
</style>
</head>
<body>
<div id="login" class="center">
  <div class="card">
    <div class="eyebrow">Private prototype</div>
    <h1 class="brand">Marina<br>On Demand</h1>
    <p>Brand. Lead. Convert. Sign in with your email and Marina will send you a secure magic link.</p>
    <form id="loginForm" class="field">
      <input id="email" type="email" placeholder="you@example.com" required>
      <button class="primary" type="submit">Send link</button>
    </form>
    <div id="loginStatus" class="note"></div>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="logo brand">Marina<br>On Demand<small>Brand. Lead. Convert.</small></div>
    <button id="newChat" class="new">+ New conversation</button>
    <div id="threads" class="threads"></div>
    <div class="sidefoot"><span id="userEmail"></span><br><button id="signOut" style="border:0;background:transparent;padding:8px 0;color:inherit;cursor:pointer">Sign out</button></div>
  </aside>
  <section class="main">
    <header class="top"><strong>Marina On Demand 2.0</strong><span id="modelLabel">Private prototype</span></header>
    <div id="messages" class="messages"></div>
    <div class="composerWrap">
      <div id="pending" class="pending"></div>
      <form id="composer" class="composer">
        <input id="fileInput" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/markdown,application/json,text/csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
        <button id="attachBtn" class="attach" type="button" title="Attach screenshot, image, PDF or document">＋</button>
        <textarea id="input" placeholder="Ask Marina..."></textarea>
        <button class="send" type="submit">↑</button>
      </form>
      <div id="status" class="status"></div>
    </div>
  </section>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { marked } from "https://esm.sh/marked@15";
import DOMPurify from "https://esm.sh/dompurify@3";

const qs = s => document.querySelector(s);
const state = { supabase:null, session:null, conversationId:"", messages:[], conversations:[], loading:false, pendingFiles:[] };

const config = await fetch("/api/config").then(r=>r.json());
qs("#modelLabel").textContent = `Private prototype · ${config.model || "Marina 2.0"} · ${config.build || "build"}`;
state.supabase = createClient(config.supabaseUrl, config.supabasePublishableKey, {
  auth:{persistSession:true,detectSessionInUrl:true,flowType:"pkce"}
});

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderMarkdown(s){
  const raw = marked.parse(String(s||""), {gfm:true, breaks:false});
  return DOMPurify.sanitize(raw, {
    USE_PROFILES:{html:true},
    ADD_ATTR:["target","rel"]
  });
}
function authHeader(){return {Authorization:`Bearer ${state.session.access_token}`,"content-type":"application/json"}}

async function refreshSession(){
  const {data} = await state.supabase.auth.getSession();
  state.session = data.session;
  if(state.session){
    qs("#login").style.display="none"; qs("#app").style.display="grid";
    qs("#userEmail").textContent=state.session.user.email || "";
    await loadConversations(); renderWelcome();
  }else{
    qs("#login").style.display="grid"; qs("#app").style.display="none";
  }
}
state.supabase.auth.onAuthStateChange((_e,s)=>{state.session=s; refreshSession()});
await refreshSession();

qs("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=qs("#email").value.trim();
  qs("#loginStatus").textContent="Sending secure link...";
  const {error}=await state.supabase.auth.signInWithOtp({
    email,
    options:{ emailRedirectTo: window.location.origin }
  });
  qs("#loginStatus").textContent=error ? error.message : "Check your email. Click the Marina On Demand sign-in link.";
});

qs("#signOut").addEventListener("click",async()=>{await state.supabase.auth.signOut();location.href="/"});
qs("#newChat").addEventListener("click",()=>{state.conversationId="";state.messages=[];state.pendingFiles=[];renderPending();renderWelcome();renderThreads()});
qs("#composer").addEventListener("submit",e=>{e.preventDefault();send()});
qs("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
qs("#attachBtn").addEventListener("click",()=>qs("#fileInput").click());
qs("#fileInput").addEventListener("change",e=>{
  const files=[...(e.target.files||[])];
  for(const file of files){
    if(state.pendingFiles.length>=5){qs("#status").textContent="Up to 5 attachments per message.";break}
    if(file.size>20*1024*1024){qs("#status").textContent=`${file.name} is over 20 MB.`;continue}
    state.pendingFiles.push(file);
  }
  e.target.value="";
  renderPending();
});


function readableSize(n){
  if(!n)return"0 B";
  if(n<1024)return`${n} B`;
  if(n<1024*1024)return`${(n/1024).toFixed(1)} KB`;
  return`${(n/1024/1024).toFixed(1)} MB`;
}
function renderPending(){
  qs("#pending").innerHTML=state.pendingFiles.map((f,i)=>{
    const image=f.type.startsWith("image/") ? `<img src="${URL.createObjectURL(f)}" alt="">` : "";
    return `<div class="filechip">${image}<span>${esc(f.name)}<br><small>${readableSize(f.size)}</small></span><button type="button" data-remove="${i}">×</button></div>`;
  }).join("");
  qs("#pending").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
    state.pendingFiles.splice(Number(b.dataset.remove),1);renderPending();
  });
}
function cleanFileName(name){
  return String(name||"attachment")
    .replace(/[^a-zA-Z0-9._-]+/g,"-")
    .replace(/-+/g,"-")
    .slice(-120);
}
async function uploadPendingFiles(){
  const uploaded=[];
  for(const file of state.pendingFiles){
    const path=`${state.session.user.id}/${Date.now()}-${crypto.randomUUID()}-${cleanFileName(file.name)}`;
    qs("#status").textContent=`Uploading ${file.name}...`;
    const {error}=await state.supabase.storage
      .from("marina-attachments")
      .upload(path,file,{contentType:file.type||undefined,upsert:false});
    if(error)throw new Error(`Upload failed: ${error.message}`);
    uploaded.push({
      storagePath:path,
      fileName:file.name,
      mimeType:file.type||"application/octet-stream",
      sizeBytes:file.size
    });
  }
  return uploaded;
}

async function api(url, options={}){
  const r=await fetch(url,{...options,headers:{...authHeader(),...(options.headers||{})}});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error || "Request failed");
  return j;
}

async function loadConversations(){
  try{
    const j=await api("/api/conversations");
    state.conversations=j.conversations||[]; renderThreads();
  }catch(e){qs("#status").textContent=e.message}
}
function renderThreads(){
  qs("#threads").innerHTML=state.conversations.map(c=>`<button class="thread ${c.id===state.conversationId?"active":""}" data-id="${c.id}">${esc(c.title||"Conversation")}</button>`).join("");
  qs("#threads").querySelectorAll("button").forEach(b=>b.onclick=()=>selectConversation(b.dataset.id));
}
async function selectConversation(id){
  state.conversationId=id;
  const j=await api(`/api/messages?conversationId=${encodeURIComponent(id)}`);
  state.messages=j.messages||[]; renderMessages(); renderThreads();
}
function renderWelcome(){
  if(state.messages.length){renderMessages();return}
  qs("#messages").innerHTML=`<div class="welcome">
    <h2 class="brand">What are we fixing today?</h2>
    <p>Bring me the messy caption, the vague offer, the dead DMs, the Reel that got views but no buyers, or the thing you keep overthinking.</p>
    <div class="quick">
      ${[
        "Rewrite my profile like a Lead Slayer",
        "Create my Seven Layers Deep DM flow",
        "Turn my story into a weekly live",
        "Build my warm lead follow-up plan"
      ].map(x=>`<button data-p="${esc(x)}">${esc(x)}</button>`).join("")}
    </div></div>`;
  qs("#messages").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p));
}
function renderMessages(){
  if(!state.messages.length){renderWelcome();return}
  qs("#messages").innerHTML=state.messages.map(m=>{
    const atts=(m.attachments||[]).map(a=>{
      const img=(a.mime_type||"").startsWith("image/") && a.signed_url
        ? `<img src="${esc(a.signed_url)}" alt="${esc(a.file_name)}">`
        : "";
      const link=a.signed_url
        ? `<a href="${esc(a.signed_url)}" target="_blank" rel="noopener">${esc(a.file_name)}</a>`
        : esc(a.file_name);
      return `<div class="attachmentCard">${img}${link}<br><small>${readableSize(a.size_bytes||0)}</small></div>`;
    }).join("");
    const body = m.role==="assistant"
      ? `<div class="markdown">${renderMarkdown(m.content)}</div>`
      : `<div>${esc(m.content)}</div>`;
    return `<div class="msg ${m.role}">
      <div class="avatar">${m.role==="assistant"?"M":"YOU"}</div>
      <div class="bubble">${body}${atts?`<div class="attachmentList">${atts}</div>`:""}</div>
    </div>`;
  }).join("") + (state.loading?`<div class="msg assistant"><div class="avatar">M</div><div class="bubble">Thinking...</div></div>`:"");
  qs("#messages").scrollTop=qs("#messages").scrollHeight;
}
async function send(prefill){
  const input=qs("#input");
  const value=String(prefill ?? input.value).trim();
  if((!value&&!state.pendingFiles.length)||state.loading)return;

  state.loading=true;
  input.value="";
  qs("#status").textContent="";

  const localAttachments=state.pendingFiles.map(f=>({
    file_name:f.name,
    mime_type:f.type,
    size_bytes:f.size,
    signed_url:f.type.startsWith("image/") ? URL.createObjectURL(f) : null
  }));

  state.messages.push({
    role:"user",
    content:value||"[Attachment]",
    attachments:localAttachments
  });
  renderMessages();

  try{
    const attachments=await uploadPendingFiles();
    state.pendingFiles=[];
    renderPending();
    qs("#status").textContent="Marina is looking at it...";

    const j=await api("/api/chat",{
      method:"POST",
      body:JSON.stringify({
        message:value,
        conversationId:state.conversationId||undefined,
        attachments
      })
    });

    state.conversationId=j.conversationId;
    state.messages.push({role:"assistant",content:j.answer,attachments:[]});
    await loadConversations();
    qs("#status").textContent="";
  }catch(e){
    qs("#status").textContent=e.message;
  }

  state.loading=false;
  renderMessages();
}
</script>
</body>
</html>
